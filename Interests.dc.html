<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interests</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/abhaya.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.steps{display:flex;justify-content:center;gap:6px;margin-top:8px}
.steps i{width:28px;height:6px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.steps i.on{background:var(--teal);box-shadow:none}
.opt .lt svg{width:17px;height:17px}
.opt .tx b{font-size:15px}
</style>
</helmet>
<div class="app">
  <div class="top">
    <a class="ib" href="{{backHref}}" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"></path></svg></a>
    <sc-if value="{{onboarding}}" hint-placeholder-val="{{true}}"><div class="ttl">Step 3 of 3<div class="steps" role="img" aria-label="Step 3 of 3"><i class="on"></i><i class="on"></i><i class="on"></i></div></div></sc-if><sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><div class="ttl">My interests</div></sc-if>
    <span class="sp"></span>
  </div>
  <div class="page nonav">
    <h1 class="hl">Your focus<span>change it anytime</span></h1>
    <div class="sec"><h2>Topics</h2><span class="tag" aria-live="polite">{{count}} of 3 picked</span></div>
    <div class="chips"><sc-for list="{{topics}}" as="t" hint-placeholder-count="12"><button class="{{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">{{t.n}}</button></sc-for></div>
    <div class="sec"><h2>How you like to learn</h2></div>
    <div class="stack" role="radiogroup" aria-label="How you like to learn">
      <sc-for list="{{ways}}" as="w" hint-placeholder-count="4">
        <button class="{{w.cls}}" onClick="{{w.pick}}" role="radio" aria-checked="{{w.on}}">
          <span class="lt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg></span>
          <span class="tx"><b>{{w.n}}</b><span>{{w.d}}</span></span>
          <span class="radio" aria-hidden="true"></span>
        </button>
      </sc-for>
    </div>
    <a class="btn" href="{{doneHref}}" style="margin-top:6px">{{doneLbl}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const REF = (() => { try { return (document.referrer.split('/').pop() || '').split('?')[0].replace('.dc.html', ''); } catch (e) { return ''; } })();
const editing = REF === 'Profile';
const sel = this.state?.sel ?? ['Med-Surg', 'Critical care'];
const way = this.state?.way ?? 'Stories';
const toggle = (n) => {
if (sel.includes(n)) this.setState({ sel: sel.filter(x => x !== n) });
else if (sel.length < 3) this.setState({ sel: [...sel, n] });
};
const names = ['Anatomy','Med-Surg','Critical care','Paediatrics','Mental health','Community','Obstetrics','Emergency','Pharmacology','Oncology','Geriatrics','Nutrition'];
const ways = [
['Stories','Real-life examples','M12 6.5C10.3 5.2 8 4.5 4 4.5v13c4 0 6.3.7 8 2 1.7-1.3 4-2 8-2v-13c-4 0-6.3.7-8 2zM12 6.5v13'],
['Step by step','One idea at a time','M4 18.5h5v-5h5v-5h5v-4'],
['Quick notes','Key points only','M7 3.5h7l4 4V20.5H6V3.5zM14 3.5V8h4M9 12.5h6M9 16h4'],
['Questions','Think it through','M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z']
];
return {
editing, onboarding: !editing, backHref: editing ? 'Profile.dc.html' : 'ProfileSetup.dc.html', doneHref: editing ? 'Profile.dc.html' : 'Home.dc.html', doneLbl: editing ? 'Save changes' : 'Start learning',
count: sel.length,
topics: names.map(n => ({ n, on: sel.includes(n) ? 'true' : 'false', cls: sel.includes(n) ? 'chip on' : 'chip', pick: () => toggle(n) })),
ways: ways.map(([n, d, icon]) => ({ n, d, icon, on: n === way ? 'true' : 'false', cls: n === way ? 'opt on' : 'opt', pick: () => this.setState({ way: n }) }))
};
}
}
</script>
</body>
</html>
