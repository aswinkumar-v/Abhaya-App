.steps i{width:28px;height:6px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.steps i.on{background:var(--teal);box-shadow:none}
.or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12px}

    <p class="mu" style="text-align:center;font-size:13px;padding-top:4px">Have an account? <a class="link" href="Login.dc.html">Sign in</a></p>
  </div>
</div>
