<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile setup</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/abhaya.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.steps{display:flex;justify-content:center;gap:6px;margin-top:8px}
.steps i{width:28px;height:6px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.steps i.on{background:var(--teal);box-shadow:none}
.addph{width:64px;height:64px;border-radius:32px;border:1.5px dashed #A9C6BE;background:var(--mint2);display:flex;align-items:center;justify-content:center;color:var(--teal);flex:none}
.addph svg{width:22px;height:22px}
.sems{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sems .chip{padding:0;box-shadow:none;background:var(--track)}
.sems .chip.on{background:var(--deep)}
.flab{font-size:13px;font-weight:500;color:var(--ink2);margin:0 0 10px}
</style>
</helmet>
<div class="app">
  <div class="top">
    <a class="ib" href="SignUp.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"></path></svg></a>
    <div class="ttl">Step 2 of 3<div class="steps" role="img" aria-label="Step 2 of 3"><i class="on"></i><i class="on"></i><i></i></div></div>
    <span class="sp"></span>
  </div>
  <div class="page nonav">
    <h1 class="hl">About you<span>so your plan fits your course</span></h1>
    <div class="card row" style="gap:16px;margin-top:6px">
      <button class="addph" aria-label="Add a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3V19H4z"></path><circle cx="12" cy="13.5" r="3.2"></circle></svg></button>
      <div class="tx"><b>Profile photo</b><span>Optional. Camera or gallery.</span></div>
    </div>
    <div class="card stack" style="gap:20px">
      <div class="field"><label for="sid">Student ID</label><input id="sid" type="text" placeholder="e.g. BSN2024-117"></div>
      <div role="group" aria-labelledby="semL">
        <p class="flab" id="semL">Semester</p>
        <div class="sems"><sc-for list="{{sems}}" as="s" hint-placeholder-count="8"><button class="{{s.cls}}" onClick="{{s.pick}}" aria-pressed="{{s.on}}">{{s.n}}</button></sc-for></div>
      </div>
      <div role="group" aria-labelledby="minL">
        <p class="flab" id="minL">Daily study time</p>
        <div class="seg soft"><sc-for list="{{mins}}" as="m" hint-placeholder-count="4"><button class="{{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}">{{m.n}}</button></sc-for></div>
      </div>
    </div>
    <a class="btn" href="Interests.dc.html" style="margin-top:auto">Continue<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sem = this.state?.sem ?? 3, min = this.state?.min ?? '30 min';
return {
sems: [1,2,3,4,5,6,7,8].map(n => ({ n: 'Sem ' + n, on: n === sem ? 'true' : 'false', cls: n === sem ? 'chip on' : 'chip', pick: () => this.setState({ sem: n }) })),
mins: ['15 min','30 min','45 min','60 min'].map(n => ({ n, on: n === min ? 'true' : 'false', cls: n === min ? 'on' : '', pick: () => this.setState({ min: n }) }))
};
}
}
</script>
</body>
</html>
