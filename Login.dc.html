<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/abhaya.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12px}
.or span{flex:1;height:1px;background:var(--line)}
</style>
</helmet>
<div class="app">
  <div class="top">
    <a class="ib" href="Main.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"></path></svg></a>
    <span class="ttl"></span><span class="sp"></span>
  </div>
  <div class="page nonav">
    <h1 class="hl">Welcome back<span>let's keep learning</span></h1>
    <form class="card stack" style="gap:16px;margin-top:6px">
      <div class="field"><label for="em">Email</label><input id="em" type="email" placeholder="you@college.edu" autocomplete="email"></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" placeholder="Your password" autocomplete="current-password"></div>
      <button class="link" onClick="{{forgot}}" style="align-self:flex-end;border:0;background:none;padding:0;font:inherit;cursor:pointer">Forgot password?</button>
      <sc-if value="{{sent}}" hint-placeholder-val="{{false}}"><p class="note" role="status" style="margin:0">We sent a reset link to your email. Check your inbox.</p></sc-if>
    </form>
    <a class="btn" href="Home.dc.html">Sign in</a>
    <div class="or"><span></span>or<span></span></div>
    <a class="btn ghost" href="Home.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"></path><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"></path><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z"></path><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"></path></svg>Continue with Google</a>
    <p class="mu" style="text-align:center;font-size:13px;margin-top:auto;padding-top:8px">New here? <a class="link" href="SignUp.dc.html">Create an account</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { const sent = this.state?.sent ?? false; return { sent, forgot: () => this.setState({ sent: true }) }; }
}
</script>
</body>
</html>
