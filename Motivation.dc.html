<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motivation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/abhaya.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.quote{margin:0;font-size:18px;font-weight:500;line-height:1.35;letter-spacing:-.02em;color:var(--ink)}
.heart{width:56px;height:56px;border-radius:28px;flex:none;border:0;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--ease)}
.heart:active{transform:scale(.94)}
.heart svg{width:20px;height:20px}
.qd{display:flex;gap:6px}.qd i{display:block;width:8px;height:8px;border-radius:4px;background:#D9E1DF}.qd i.on{width:22px;background:var(--deep)}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
.spark.s2{animation-delay:1.4s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
</style>
</helmet>
<div class="app blush">
  <div class="top">
    <a class="ib" href="Wellbeing.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"></path></svg></a>
    <span class="ttl">Daily motivation<small>A thought for today</small></span>
    <button class="ib" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14.5V3.5M7.5 8 12 3.5 16.5 8M5.5 12.5v6.5a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-6.5"></path></svg></button>
  </div>
  <div class="page nonav" style="justify-content:center">
    <div class="card stack" style="gap:16px;padding:24px 20px">
      <span class="fuss md happy" role="img" aria-label="Fuss cheering you on"><svg class="fz-svg" viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="fz8B" gradientUnits="userSpaceOnUse" cx="78" cy="48" r="170"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".38" stop-color="#F1EEFA"></stop><stop offset=".72" stop-color="#D9D3F1"></stop><stop offset="1" stop-color="#BDB3E6"></stop></radialGradient><radialGradient id="fz8F" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".55" stop-color="#E6E1F6"></stop><stop offset="1" stop-color="#C3B9EA"></stop></radialGradient><radialGradient id="fz8E"><stop offset="0" stop-color="#FFAE9C" stop-opacity=".95"></stop><stop offset=".6" stop-color="#FFC2B4" stop-opacity=".45"></stop><stop offset="1" stop-color="#FFC2B4" stop-opacity="0"></stop></radialGradient><radialGradient id="fz8T"><stop offset="0" stop-color="#8FDDEB" stop-opacity=".55"></stop><stop offset="1" stop-color="#8FDDEB" stop-opacity="0"></stop></radialGradient><radialGradient id="fz8C"><stop offset="0" stop-color="#FF9EA8" stop-opacity=".55"></stop><stop offset="1" stop-color="#FF9EA8" stop-opacity="0"></stop></radialGradient></defs>
<ellipse class="fz-shadow" cx="104" cy="188" rx="66" ry="7" fill="#9C92D6" opacity=".28"></ellipse>
<g class="fz-body">
<ellipse cx="150" cy="160" rx="27" ry="23" fill="url(#fz8F)"></ellipse>
<ellipse cx="104" cy="142" rx="56" ry="42" fill="url(#fz8B)"></ellipse>
<ellipse cx="104" cy="86" rx="68" ry="64" fill="url(#fz8B)"></ellipse>
<ellipse cx="60" cy="122" rx="44" ry="50" fill="url(#fz8T)"></ellipse>
<ellipse cx="58" cy="150" rx="20" ry="24" fill="url(#fz8F)"></ellipse>
<ellipse cx="96" cy="166" rx="29" ry="23" fill="url(#fz8F)"></ellipse>
<circle class="fz-ear" cx="56" cy="92" r="34" fill="url(#fz8E)"></circle>
<circle class="fz-cheek" cx="118" cy="116" r="12" fill="url(#fz8C)"></circle><circle class="fz-cheek" cx="162" cy="113" r="10" fill="url(#fz8C)"></circle>
<g class="fz-face" fill="none" stroke="#2B2547" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<g class="fz-f calm"><path d="M110 100q8 7 16 0M150 98q7 6 13 0"></path></g>
<g class="fz-f happy"><path d="M110 103q8-9 16 0M150 101q7-8 13 0M132 114q5 6 11 0"></path></g>
<g class="fz-f okay"><g class="fz-blink"><circle cx="118" cy="100" r="3.2" fill="#2B2547" stroke="none"></circle><circle cx="156" cy="98" r="3" fill="#2B2547" stroke="none"></circle></g><path d="M133 116h9"></path></g>
<g class="fz-f sad"><path d="M110 93l12-4M163 91l-11-4M132 121q5-5 11 0"></path><circle cx="118" cy="101" r="3.2" fill="#2B2547" stroke="none"></circle><circle cx="156" cy="99" r="3" fill="#2B2547" stroke="none"></circle><path class="fz-tear" d="M118 108q-4 7 0 9q4-2 0-9z" fill="#8FC9F0" stroke="none"></path></g>
<g class="fz-f tired"><path d="M110 102h15M150 100h13M134 117q3 2 6 0"></path><text class="fz-z" x="168" y="70" fill="#9C92D6" stroke="none" font-size="16" font-weight="700" font-family="Figtree,sans-serif">z</text><text class="fz-z z2" x="178" y="56" fill="#B6AEE2" stroke="none" font-size="12" font-weight="700" font-family="Figtree,sans-serif">z</text></g>
<g class="fz-f stressed"><path d="M112 96l10 5-10 5M161 94l-10 5 10 5M129 118q2.5-3 5 0t5 0t5 0"></path><path class="fz-sweat" d="M178 76q-4 7 0 9q4-2 0-9z" fill="#8FC9F0" stroke="none"></path></g>
</g>
</g>
<g class="fz-wave" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M18 92v4M24 89v10M30 84v20M36 78v32M42 72v44M48 80v28M54 86v16M60 90v8"></path></g>
</svg></span>
      <span class="tag p" style="align-self:flex-start">For you today</span>
      <p class="quote" aria-live="polite">{{q}}</p>
      <div class="row" style="justify-content:space-between">
        <span class="qd" aria-hidden="true"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><i class="{{d.cls}}"></i></sc-for></span>
        <span class="mu">Thought {{num}} of 4</span>
      </div>
    </div>
  </div>
  <div class="row" style="padding:0 20px 40px;gap:12px">
    <button class="btn ink" onClick="{{next}}" style="flex:1">New thought</button>
    <button class="heart" onClick="{{fav}}" aria-label="Save" aria-pressed="{{favA}}" style="{{favSt}}"><svg viewBox="0 0 24 24" fill="{{favF}}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const qs = [
'Every patient you’ll ever help is a little safer because you studied tonight.',
'You don’t have to know everything yet. You just have to keep learning.',
'Rest is part of the work. A tired nurse can’t pour from an empty cup.',
'Small steps every day add up to a confident nurse.'
];
const i = this.state?.i ?? 0, f = this.state?.f ?? false;
return {
q: qs[i], num: i + 1,
dots: qs.map((_, k) => ({ cls: k === i ? 'on' : '' })),
next: () => this.setState({ i: (i + 1) % qs.length, f: false }),
fav: () => this.setState({ f: !f }),
favA: f ? 'true' : 'false',
favSt: f ? 'color:var(--bad);background:var(--bad-bg)' : 'color:var(--ink)',
favF: f ? 'currentColor' : 'none'
};
}
}
</script>
</body>
</html>
