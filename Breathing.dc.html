<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="assets/abhaya.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
.br-mu{margin:0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.72);text-align:center}
.app.dark .top .ttl small{color:rgba(255,255,255,.65)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:0 20px}
.orbwrap{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
.halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(143,220,192,.42) 0%,rgba(143,220,192,.14) 52%,rgba(143,220,192,0) 70%)}
.ring{position:absolute;inset:38px;border-radius:50%;border:1px solid rgba(221,239,231,.28);background:rgba(221,239,231,.07)}
.orb{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;transform:scale(.7)}
.labs{position:relative;height:28px;width:100%}
.labs{height:36px}
.lab{position:absolute;left:0;right:0;text-align:center;font-size:24px;font-weight:500;letter-spacing:-.025em;line-height:36px;opacity:0;color:#fff}
.l1{opacity:1}.l4{display:none}
.ec{opacity:0}
.br-play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:28px;border:0;background:#fff;color:var(--ink);font-size:15px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.18);transition:transform .2s var(--ease)}
.br-play:active{transform:scale(.98)}
.br-play svg{width:18px;height:18px}
.rd{display:flex;gap:6px}.rd i{display:block;width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.25)}.rd i.on{background:#8FDCC0}
.phs{display:flex;gap:8px;justify-content:center}
@keyframes breathe{0%{transform:scale(.7)}21%{transform:scale(1)}58%{transform:scale(1)}100%{transform:scale(.7)}}
@keyframes haloP{0%{opacity:.35}21%,58%{opacity:1}100%{opacity:.35}}
@keyframes lin{0%,20%{opacity:1}22%,100%{opacity:0}}
@keyframes lhold{0%,21%{opacity:0}23%,56%{opacity:1}58%,100%{opacity:0}}
@keyframes lout{0%,57%{opacity:0}59%,98%{opacity:1}100%{opacity:0}}
@keyframes eyeO{0%,20%{opacity:1}22%,56%{opacity:0}58%,100%{opacity:1}}
@keyframes eyeC{0%,20%{opacity:0}22%,56%{opacity:1}58%,100%{opacity:0}}
.orb{animation:breathe 19s ease-in-out infinite}
.halo{animation:haloP 19s ease-in-out infinite}
.l1{animation:lin 19s linear infinite}
.l2{animation:lhold 19s linear infinite}
.l3{animation:lout 19s linear infinite}
.eo{animation:eyeO 19s linear infinite}
.ec{animation:eyeC 19s linear infinite}
@media (prefers-reduced-motion:reduce){
.orb{transform:scale(.88)}.halo{opacity:.8}
.l1,.l2,.l3{display:none}.l4{display:block;opacity:1}
.eo{opacity:0}.ec{opacity:1}
}
</style>
</helmet>
<div class="app dark">
  <div class="top">
    <a class="ib" href="Wellbeing.dc.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"></path></svg></a>
    <span class="ttl">Breathe<small>4-7-8 technique · 1 min</small></span>
    <span class="sp"></span>
  </div>
  <div class="stage">
    <div class="orbwrap">
      <div class="halo" style="{{ps}}"></div>
      <div class="orb" style="{{ps}}">
        <div class="ring"></div>
        <span class="fuss lg calm still" role="img" aria-label="Fuss breathing with you"><svg class="fz-svg" viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="fz10B" gradientUnits="userSpaceOnUse" cx="78" cy="48" r="170"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".38" stop-color="#F1EEFA"></stop><stop offset=".72" stop-color="#D9D3F1"></stop><stop offset="1" stop-color="#BDB3E6"></stop></radialGradient><radialGradient id="fz10F" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".55" stop-color="#E6E1F6"></stop><stop offset="1" stop-color="#C3B9EA"></stop></radialGradient><radialGradient id="fz10E"><stop offset="0" stop-color="#FFAE9C" stop-opacity=".95"></stop><stop offset=".6" stop-color="#FFC2B4" stop-opacity=".45"></stop><stop offset="1" stop-color="#FFC2B4" stop-opacity="0"></stop></radialGradient><radialGradient id="fz10T"><stop offset="0" stop-color="#8FDDEB" stop-opacity=".55"></stop><stop offset="1" stop-color="#8FDDEB" stop-opacity="0"></stop></radialGradient><radialGradient id="fz10C"><stop offset="0" stop-color="#FF9EA8" stop-opacity=".55"></stop><stop offset="1" stop-color="#FF9EA8" stop-opacity="0"></stop></radialGradient></defs>
<ellipse class="fz-shadow" cx="104" cy="188" rx="66" ry="7" fill="#9C92D6" opacity=".28"></ellipse>
<g class="fz-body">
<ellipse cx="150" cy="160" rx="27" ry="23" fill="url(#fz10F)"></ellipse>
<ellipse cx="104" cy="142" rx="56" ry="42" fill="url(#fz10B)"></ellipse>
<ellipse cx="104" cy="86" rx="68" ry="64" fill="url(#fz10B)"></ellipse>
<ellipse cx="60" cy="122" rx="44" ry="50" fill="url(#fz10T)"></ellipse>
<ellipse cx="58" cy="150" rx="20" ry="24" fill="url(#fz10F)"></ellipse>
<ellipse cx="96" cy="166" rx="29" ry="23" fill="url(#fz10F)"></ellipse>
<circle class="fz-ear" cx="56" cy="92" r="34" fill="url(#fz10E)"></circle>
<circle class="fz-cheek" cx="118" cy="116" r="12" fill="url(#fz10C)"></circle><circle class="fz-cheek" cx="162" cy="113" r="10" fill="url(#fz10C)"></circle>
<g class="fz-face" fill="none" stroke="#2B2547" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<g class="fz-f calm"><path d="M110 100q8 7 16 0M150 98q7 6 13 0"></path></g>
<g class="fz-f happy"><path d="M110 103q8-9 16 0M150 101q7-8 13 0M132 114q5 6 11 0"></path></g>
<g class="fz-f okay"><g class="fz-blink"><circle cx="118" cy="100" r="3.2" fill="#2B2547" stroke="none"></circle><circle cx="156" cy="98" r="3" fill="#2B2547" stroke="none"></circle></g><path d="M133 116h9"></path></g>
<g class="fz-f sad"><path d="M110 93l12-4M163 91l-11-4M132 121q5-5 11 0"></path><circle cx="118" cy="101" r="3.2" fill="#2B2547" stroke="none"></circle><circle cx="156" cy="99" r="3" fill="#2B2547" stroke="none"></circle><path class="fz-tear" d="M118 108q-4 7 0 9q4-2 0-9z" fill="#8FC9F0" stroke="none"></path></g>
<g class="fz-f tired"><path d="M110 102h15M150 100h13M134 117q3 2 6 0"></path><text class="fz-z" x="168" y="70" fill="#9C92D6" stroke="none" font-size="16" font-weight="700" font-family="Figtree,sans-serif">z</text><text class="fz-z z2" x="178" y="56" fill="#B6AEE2" stroke="none" font-size="12" font-weight="700" font-family="Figtree,sans-serif">z</text></g>
<g class="fz-f stressed"><path d="M112 96l10 5-10 5M161 94l-10 5 10 5M129 118q2.5-3 5 0t5 0t5 0"></path><path class="fz-sweat" d="M178 76q-4 7 0 9q4-2 0-9z" fill="#8FC9F0" stroke="none"></path></g>
</g>
</g>
<g class="fz-wave" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M18 92v4M24 89v10M30 84v20M36 78v32M42 72v44M48 80v28M54 86v16M60 90v8"></path></g>
</svg></span>
      </div>
    </div>
    <div class="labs" aria-live="off">
      <div class="lab l1" style="{{ps}}">Breathe in</div>
      <div class="lab l2" style="{{ps}}">Hold</div>
      <div class="lab l3" style="{{ps}}">Breathe out</div>
      <div class="lab l4">Breathe slowly</div>
    </div>
    <div class="phs" aria-hidden="true"><span class="gpill">In 4</span><span class="gpill">Hold 7</span><span class="gpill">Out 8</span></div>
  </div>
  <div class="stack" style="align-items:center;gap:16px;padding:0 20px 40px">
    <div class="row" style="gap:10px">
      <span class="rd" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i></span>
      <span class="br-mu" style="font-weight:600;color:#fff">Round 2 of 4</span>
    </div>
    <p class="br-mu" style="max-width:280px">Four rounds settle your body before a shift or exam.</p>
    <button class="br-play" onClick="{{toggle}}" aria-label="{{label}}">
      <sc-if value="{{running}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7z"></path></svg></sc-if>
      {{label}}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const running = this.state?.running ?? true;
return {
running, paused: !running,
ps: running ? 'animation-play-state:running' : 'animation-play-state:paused',
label: running ? 'Pause' : 'Resume',
toggle: () => this.setState({ running: !running })
};
}
}
</script>
</body>
</html>
